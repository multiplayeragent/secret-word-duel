<script>
/* ═══ SECRET WORD DUEL · a Multiplayer Agent starter ══════════════════════════════════════
 * Pick a secret word. Crack theirs first. Versus, 2 players; a bot takes an empty seat.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ guesses, timers, how the bot plays, the leaderboard
 *   WORDS ......... the word list (bots pick from COMMON; any word in either list is a valid
 *                   guess), and score(): the green / yellow / grey clue for a guess
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED SECRETS  the Seal helper: your word is encrypted so only you (and the host) can read it
 *   DUEL (HOST) ... seats, the pick phase, checking guesses, whose turn, who won, the bot,
 *                   and taking over as a new host. Only the host writes the shared fields.
 *   ME ............ typing, picking and locking my word, guessing, re-sending to a new host
 *   SCREEN ........ the two boards, my secret, the keyboard, flips, confetti, sounds
 *   RESULTS ....... the duel-over card and the leaderboard
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The duel lives in shared fields only the HOST writes: `game` (one JSON field: id, v,
 *     phase, seats, who went first, turn, every guess with its clue, timers, the winner) and
 *     `secrets` (each human's own word, SEALED to that player, proving the host has it).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s).
 *     It keeps both secret words in memory and works out every clue, so nobody else ever
 *     sees a word until the duel ends. (The host can read them: fine for friends.)
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `pk` (public key), `hb`,
 *     and `ty` (how many letters it has typed, so the rival sees dots fill in).
 *   - Intents to the host: "word" {to, g, box} (my secret, sealed to the host), "guess"
 *     {g, t, w}, "again" {g}. `t` counts every guess, so an old or double intent is ignored.
 *   - When the host changes, each player re-sends its word sealed to the new host. A bot's word
 *     is lost with the old host, so the new host picks one that fits every clue given so far.
 *   - Timers are timestamps in `game`: pick ends at endsAt, each turn at turnEnds.
 *   - ?attract plays offline: two bots duel (the preview video is recorded from it).
 *   - Leaderboard "duel-wins": +1 for each duel a player wins, shown after every duel.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  pickMs: 45000,             // time to pick a secret word (then the host picks one for you)
  turnMs: 60000,             // time per guess; run out and that guess is lost
  startMs: 1400,             // the "Duel!" moment before the first guess
  botPickMs: [1500, 4000],   // how long a bot takes to pick its word
  botMs: [2500, 5500],       // how long a bot thinks per guess
  botSloppy: 0.35,           // chance a bot's guess only respects its green letters (keeps it beatable)
  overMs: 15000,             // the results card shows this long, then the next duel starts
  seatGraceMs: 8000,         // a player silent this long hands its seat to a bot
  rejoinMs: 3000,            // a new host waits this long for players to re-send their words

const OPENERS = ["crane", "slate", "trace", "stare", "arise", "raise", "audio", "house", "plant", "heart", "least", "coast"];
/** The clue for a guess against a secret: "g" right spot, "y" in the word elsewhere, "b" not in it. */
function score(guess, secret) {
  const out = ["b", "b", "b", "b", "b"], left = {};
  for (let i = 0; i < 5; i++) { if (guess[i] === secret[i]) out[i] = "g"; else left[secret[i]] = (left[secret[i]] || 0) + 1; }
  for (let i = 0; i < 5; i++) if (out[i] !== "g" && left[guess[i]]) { out[i] = "y"; left[guess[i]]--; }
  return out.join("");
}
const SOLVED = "ggggg", TIMEOUT = ".....";

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'secret-word-duel',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();

}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };

  return `<span>${label}</span>` + [0, 1, 2, 3, 4].map((k) => {
    const ch = word ? word[k] : found[k];
    return tileHtml(ch || "?", found[k] ? "found" : word ? "" : "hidden", k);
  }).join("");
}
/** Keyboard colors from my own guesses: green beats yellow beats grey. */
function keyStates(g, i) {
  const st = {};
  for (const [w, c] of g.rows[i] || []) {
    if (!w) continue; // a lost (timed-out) guess
    for (let k = 0; k < 5; k++) { const now = st[w[k]], v = c[k]; if (v === "g" || (v === "y" && now !== "g") || (v === "b" && !now)) st[w[k]] = v; }
  }
  return st;
}
let lastSig = "";
function render(g, now) {
  const i = seatOf(g, net.sessionId), seated = i >= 0 && !ATTRACT, L = seated ? i : 0, R = 1 - L;
  $("kbd").hidden = !seated; // watchers (and the ?attract preview) get bigger boards instead
  const lk = seated + ":" + innerWidth + "x" + innerHeight + ":" + $("kbd").hidden + ":" + $("hint").offsetHeight;
  if (lk !== layoutKey) { layoutKey = lk; fit(seated); }
  const picking = g.ph === "pick";
  $("pick").hidden = !picking; $("sideL").style.visibility = $("sideR").style.visibility = $("vs").style.visibility = picking ? "hidden" : "visible";
  // status line + timer
  const t = Date.now(), you = (s) => (s === i && seated ? "You" : esc(g.seats[s].n)), turnS = g.turn;
  let st = "", left = 0, span = 1;
  if (picking) { st = seated ? (g.locked[i] ? `Locked in. Waiting for ${esc(g.seats[R].n)}…` : `${Math.max(0, Math.ceil((g.endsAt - t) / 1000))}s to choose`) : "Both players are picking a secret word…"; left = g.endsAt - t; span = CONFIG.pickMs; }
  else if (g.ph === "duel") {
    left = g.turnEnds - t; span = CONFIG.turnMs;
    if (t < g.turnAt) st = `Duel! <span class="${turnS === L ? "me" : "rival"}">${you(turnS)}</span> ${turnS === i && seated ? "go" : "goes"} first`;
    else if (seated && turnS === i) st = g.final ? `<span class="rival">${esc(g.seats[R].n)}</span> cracked it! Guess now to tie` : `Your turn: guess <span class="rival">${esc(g.seats[R].n)}</span>'s word`;
    else if (seated) st = `<span class="rival">${esc(g.seats[R].n)}</span> is guessing your word…`;
    else st = `<span class="${turnS === L ? "me" : "rival"}">${esc(g.seats[turnS].n)}</span> is guessing`;
  } else if (g.ph === "over") { st = g.win < 0 ? "Draw!" : seated ? (g.win === i ? "You win!" : `${esc(g.seats[g.win].n)} wins`) : `${esc(g.seats[g.win].n)} wins`; left = g.endsAt - t; span = CONFIG.overMs; }
  if ($("stText").innerHTML !== st) $("stText").innerHTML = st;
  $("timer").style.visibility = g.ph === "over" || (g.ph === "duel" && t < g.turnAt) ? "hidden" : "visible";
  $("timer").firstElementChild.style.transform = `scaleX(${Math.max(0, Math.min(1, left / span))})`;
  // boards (rebuilt only when something on them changes)
  const ty = S.entities.players[g.seats[R].i]?.ty;
  const sig = [g.id, g.v, g.ph, i, draft.join(""), popAt, ty, myWord.w, t >= g.turnAt, ATTRACT && host.words.join()].join("|");
  if (sig !== lastSig) {
    lastSig = sig;
    for (const [el, s] of [[$("sideL"), L], [$("sideR"), R]]) {
      const isMe = seated && s === i;
      el.querySelector(".who").innerHTML = `<span class="dot" style="background:${esc(g.seats[s].c)}"></span>${isMe ? "You" : esc(g.seats[s].n)}${g.seats[s].b ? " 🤖" : ""} · ${g.rows[s].length}/${CONFIG.maxGuesses}`;
      el.querySelector(".secret").innerHTML = secretHtml(g, 1 - s, seated ? i : -1);
      el.querySelector(".grid").innerHTML = boardHtml(g, s);
      el.querySelector(".grid").classList.toggle("mini", seated && s !== i);
      el.classList.toggle("turn", g.ph === "duel" && g.turn === s);
    }
    popAt = -1;
    const ks = keyStates(g, seated ? i : 0);
    for (const b of $("kbd").querySelectorAll("button[data-k]")) b.className = (b.dataset.k.length > 1 ? "wide " : "") + (ks[b.dataset.k] || "");
  }
  if (now - shakeAt < 380) { const row = (picking ? $("pickRow") : $("sideL").querySelector(".grid .row:not(:has(.g,.y,.b))")); if (row && !row.classList.contains("shake")) { row.classList.add("shake"); setTimeout(() => row.classList.remove("shake"), 380); } }
  if (picking) renderPick(g, i, seated);
  const n = livePlayers().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the duel" : ""}`;
  $("hint").textContent = ATTRACT ? "" : !seated ? (g.ph === "over" ? "" : "You're watching. You'll get a seat when one is free.")
    : picking ? "Your rival will try to guess it. Green = right spot, yellow = in the word, grey = not in it."
    : g.ph === "duel" && g.rows[i].length === 0 ? "Type a 5-letter word and press Enter. Fewest guesses wins." : "";
  if (seated && g.ph === "duel") { const n2 = myTurn(g) ? draft.length : 0; if (n2 !== lastTy) { lastTy = n2; net.me.set("ty", n2); } }
}
function renderPick(g, i, seated) {
  const R = 1 - Math.max(0, i), locked = seated && g.locked[i], w = locked && myWord.g === g.id ? myWord.w : pickDraft.join("");
  $("pickTitle").textContent = !seated ? "Picking secret words…" : locked ? "Your secret word" : "Pick your secret word";
  $("pickSub").innerHTML = seated ? `<b style="color:${esc(g.seats[R].c)}">${esc(g.seats[R].n)}</b> will try to guess it. Pick a real 5-letter word.` : `${esc(g.seats[0].n)} vs ${esc(g.seats[1].n)}`;
  const html = rowHtml(seated ? [...w] : [], "", (k) => (k < w.length ? (locked ? "g" : "on") : ""));
  if ($("pickRow").innerHTML !== html) $("pickRow").innerHTML = html;
  $("pickBtns").hidden = !seated || locked;
  const other = g.locked[R] ? `${esc(g.seats[R].n)} is ready ✓` : `${esc(g.seats[R].n)} is choosing…`;
  const html2 = seated ? other : "";
  if ($("pickStatus").innerHTML !== html2) $("pickStatus").innerHTML = html2;
}
/** Sounds and confetti when something lands in state (effects only). */
let seenT = "", seenPh = "";
function effects(g) {
  const key = g.id + ":" + g.t, first = !seenT;
  if (key !== seenT) {
    seenT = key;
    if (!first && g.last) { const c = g.last.c; for (let k = 0; k < 5; k++) setTimeout(() => sound(c[k] === "g" ? 880 : c[k] === "y" ? 660 : 330, 0.05), 230 + k * 110); }
  }
  const ph = g.id + ":" + g.ph;
  if (ph !== seenPh) {
    const was = seenPh; seenPh = ph;
    if (!was) return;
    if (g.ph === "pick") { draft = []; pickDraft = []; sentT = ""; flipped[0].clear(); }
    if (g.ph === "over") {
      const i = seatOf(g, net.sessionId);
      if (g.win >= 0) setTimeout(() => confetti(g.win === (i >= 0 && !ATTRACT ? i : 0) ? $("sideL") : $("sideR")), 700);
      sound(g.win >= 0 && g.win === i ? 784 : 330, 0.3);
    }
  }
}
const fx = $("fx"), fxc = fx.getContext("2d"), bits = [];
function confetti(el) { const r = el.getBoundingClientRect(); for (let k = 0; k < 110; k++) bits.push({ x: r.left + r.width / 2, y: r.top + r.height * 0.4, vx: (Math.random() - 0.5) * 520, vy: -200 - Math.random() * 420, c: ["#3fbf6b", "#e6b437", "#4cc3ff", "#ff8a5c", "#fff"][k % 5], r: Math.random() * 6, life: 1.8 }); }
function drawFx(dt) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (fx.width !== Math.round(innerWidth * dpr) || fx.height !== Math.round(innerHeight * dpr)) { fx.width = Math.round(innerWidth * dpr); fx.height = Math.round(innerHeight * dpr); }
  fxc.setTransform(dpr, 0, 0, dpr, 0, 0); fxc.clearRect(0, 0, innerWidth, innerHeight);
  for (let k = bits.length - 1; k >= 0; k--) {
    const b = bits[k]; b.life -= dt; b.vy += 700 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r += dt * 8;
    if (b.life <= 0) { bits.splice(k, 1); continue; }
    fxc.save(); fxc.translate(b.x, b.y); fxc.rotate(b.r); fxc.fillStyle = b.c; fxc.globalAlpha = Math.min(1, b.life); fxc.fillRect(-4, -2.5, 8, 5); fxc.restore();
  }
}
let actx = null; // sounds start after the first tap or key (browsers require it)
function unlockAudio() { if (!actx && !ATTRACT) try { actx = new AudioContext(); } catch {} }
function sound(freq, len) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), gn = actx.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(freq, t);
  gn.gain.setValueAtTime(0.12, t); gn.gain.exponentialRampToValueAtTime(0.001, t + len + 0.08);
  o.connect(gn).connect(actx.destination); o.start(t); o.stop(t + len + 0.1);
}

// ── RESULTS ─────────────────────────────────────────────────────────────────────────
let board = null, resultsFor = -1;
function results(g) {
  $("over").hidden = g.ph !== "over" || ATTRACT;
  if (g.ph !== "over") return;
  $("oNext").textContent = `Next duel in ${Math.max(0, Math.ceil((g.endsAt - Date.now()) / 1000))}s`;
  $("again").textContent = g.ready.includes(net.sessionId) ? "Ready ✓" : "Play again";
  if (resultsFor === g.id) return;
  resultsFor = g.id;
  const i = seatOf(g, net.sessionId), won = i >= 0 && g.win === i, n = (s) => g.rows[s].length;
  $("oTitle").textContent = g.win < 0 ? "Draw!" : won ? "You win!" : `${g.seats[g.win].n} wins`;
  $("oSub").textContent = g.why === "tie" ? `Both cracked it in ${n(0)} guesses.` : g.why === "none" ? "Nobody cracked the other's word." :
    `${won ? "You" : g.seats[g.win].n} cracked it in ${n(g.win)} guess${n(g.win) === 1 ? "" : "es"}.`;
  $("oWords").innerHTML = g.seats.map((s, k) => `<div class="wl">${k === i ? "Your word" : esc(s.n) + "'s word"}</div>` + rowHtml([...(g.reveal?.[k] || "?????")], "", () => (g.rows[1 - k].some((r) => r[1] === SOLVED) ? "g" : "b"))).join("");
  $("again").hidden = i < 0;
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
$("kbd").addEventListener("pointerdown", (e) => { const b = e.target.closest("button[data-k]"); if (!b) return; e.preventDefault(); unlockAudio(); typeKey(b.dataset.k); });
addEventListener("keydown", (e) => {
  if (e.target === $("name") || e.ctrlKey || e.metaKey || e.altKey) return;
  unlockAudio();
  const k = e.key === "Enter" ? "enter" : e.key === "Backspace" ? "back" : e.key.toLowerCase();
  if (k === "enter" || k === "back" || /^[a-z]$/.test(k)) { e.preventDefault(); typeKey(k); }
});
$("rand").addEventListener("click", () => { unlockAudio(); pickDraft = [...pick(COMMON)]; sound(440, 0.05); });
$("lock").addEventListener("click", () => { unlockAudio(); lockIn(); });
$("again").addEventListener("click", () => act("again", {}));
$("name").value = myName;
$("name").addEventListener("change", () => {
  myName = $("name").value.trim().slice(0, 14) || myName;
  try { localStorage.setItem("mpa-name", myName); } catch {}
  net && net.me.set("n", myName);
});
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card")) e.preventDefault(); }, { passive: false });
addEventListener("resize", () => { layoutKey = ""; });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
/** Colors already in use: other players', and the bots' at the table. */
function takenColors() {
  const g = game(), bots = g && seatOf(g, net.sessionId) < 0 ? g.seats.filter((s) => s.b).map((s) => s.c) : [];
  return new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...bots]);
}
/** Two people joined at once in one color, or mine is a bot's: pick a free one (the later sessionId moves). */
function fixColor() {
  const g = game(), others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  const clash = others.some(([id, p]) => p.c === myColor && id < net.sessionId) || (g && seatOf(g, net.sessionId) < 0 && g.seats.some((s) => s.b && s.c === myColor));
  if (!clash) return;
  const taken = takenColors(), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}
let lastHb = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else stopHosting();
  const g = game();
  if (g) { readMyWord(g); resendWord(g, now); effects(g); render(g, now); results(g); }
  if (g && sentT && performance.now() - sentAt > 4000 && sentT === g.id + ":" + g.t) sentT = ""; // a guess lost in a host change: let me send again
  drawFx(dt);
}

(async function start() {
  if (ATTRACT) { Object.assign(CONFIG, { pickMs: 900, startMs: 500, botPickMs: [200, 600], botMs: [650, 950], overMs: 2600, botSloppy: 0.45 }); $("name").style.display = "none"; }
  net = await connect();
  net.onState((st) => { S = st; });
  for (const type of ["guess", "again"]) net.on(type, (data, from) => { if (isHost() && data) host.inbox.push({ type, from, data }); });
  net.on("word", (d, from) => { // a player's secret word, sealed to me (the host)
    if (!d || d.to !== net.sessionId) return;
    Seal.open(pkOf(from), d.box).then((v) => {
      const g = game(), i = seatOf(g, from);
      if (!v || !g || v.g !== g.id || i < 0 || !isHost()) return;
      if (!host.ready) host.known.set(i, String(v.w).toLowerCase()); else host.inbox.push({ type: "word", from, data: v });
    });
  });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  const pk = await Seal.init().catch(() => "");
  net.me.set({ n: myName, c: myColor, pk, hb: Date.now(), ty: 0 });
  requestAnimationFrame(frame);
})();
</script>
